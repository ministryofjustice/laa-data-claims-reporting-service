services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: data-claims-reporting-service-local-postgres
      SPRING_PROFILES_ACTIVE: local
      LOCALSTACK_HOST: localstack
      GATEWAY_ADDRESS: pushgateway:9091
      feature_ignore-replication-rowcount-mismatch: true
  postgres:
    image: postgres:17@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
    container_name: data-claims-reporting-service-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laa_claims_reporting_service_dev
      POSTGRES_USER: user
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  #  local AWS cloud stack for dev
  localstack:
    image: localstack/localstack:s3-community-archive@sha256:b14111811a1071ff8e05ea2d89fac68dc3aa115bcb0b053f5502a1dfffba4ff8
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
      - LOCALSTACK_INIT_SCRIPTS=/etc/localstack/init/ready.d
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./localstack-init:/etc/localstack/init/ready.d"
  pushgateway:
    image: prom/pushgateway:latest@sha256:c835998819105d84d484918908df132807c78c05f3e0e649df0c0479c6780d98
    container_name: pushgateway
    ports:
      - "9091:9091"
    volumes:
      - pushgateway-data:/data
volumes:
  postgres-data:
  pushgateway-data: