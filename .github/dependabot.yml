# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(bot)"
    cooldown:
      default-days: 3
    groups:
      gradle-updates:
        exclude-patterns:
          - "uk.gov.laa.dstew.claimsreports.*"
      internal-packages:
        patterns:
          - "uk.gov.laa.dstew.claimsreports*"
      minor:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(bot)"
    cooldown:
      default-days: 3
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
      github-actions:
        patterns:
          - "**"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(bot)"
    cooldown:
      default-days: 3
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"