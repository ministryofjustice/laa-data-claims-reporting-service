name: "Deploy"
description: 'Deploy docker image to namespace'
inputs:
  ecr-repository:
    description: "ECR repository"
    required: true
  ecr-region:
    description: "ECR region"
    required: true
  ecr-role-to-assume:
    description: "ECR role to assume"
    required: true
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true
  app-environment:
    description: "environment to which the app is being deployed [staging, production, etc]"
    required: true

runs:
  using: "composite"
  steps:

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@a0bd8225ca8cc96e57a19223ce21f2ce7230833c # latest commit for repo
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Assume role in Cloud Platform
      uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
      with:
        role-to-assume: ${{ inputs.ecr-role-to-assume }}
        aws-region: ${{ inputs.ecr-region }}

    - name: Docker login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      with:
        mask-password: 'true'

    - name: Helm deployment
      shell: bash
      env:
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        ECR_REGION: ${{ inputs.ecr-region }}
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        GIT_SHA: ${{ github.sha }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
        VALUES_FILE: .helm/data-claims-reporting-service/values/${{ inputs.app-environment }}.yaml
        RELEASE_NAME: laa-data-claims-reporting-service
      run: |
        set -euo pipefail

        echo "Deploying ${RELEASE_NAME} (${GIT_SHA}) to namespace ${KUBE_NAMESPACE}"

        helm upgrade "${RELEASE_NAME}" .helm/data-claims-reporting-service \
          --namespace "${KUBE_NAMESPACE}" \
          --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
          --set image.tag="${GIT_SHA}" \
          --set aws.region="${ECR_REGION}" \
          --values "${VALUES_FILE}" \
          --install \
          --wait \
          --timeout=10m \
          --atomic

        echo "Deployment completed successfully"

    - name: Helm diagnostics after failed deployment
      if: failure()
      shell: bash
      env:
        RELEASE_NAME: laa-data-claims-reporting-service
      run: |
        echo "Deployment failed."

        echo
        echo "===== HELM STATUS ====="
        helm status "${RELEASE_NAME}" || true

        echo
        echo "===== HELM HISTORY ====="
        helm history "${RELEASE_NAME}" || true
