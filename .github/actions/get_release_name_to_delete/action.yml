name: "Get merged release name"
description: 'Get the release name for the PR that has just been closed or merged into Main branch'

outputs:
  merged-branch-name:
    description: "Extracted merged branch name"
    value: ${{ steps.extract_branch.outputs.branch_name }}
  release-name-to-delete:
    description: "Extracted merged release name"
    value: ${{ steps.extract_release.outputs.release-name }}

runs:
  using: "composite"
  steps:

    - name: Get deleted/merged/closed branch name
      id: get_pr_branch
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PULL_REQ_REF: ${{ github.event.pull_request.head.ref }}
        EVENT_REF: ${{ github.event.ref }}
      run: |
        if [[ "${EVENT_NAME}" == "pull_request" ]]; then
          echo "branch_name=${PULL_REQ_REF}" >> $GITHUB_OUTPUT
        elif [[ "${EVENT_NAME}" == "push" ]]; then
          echo "branch_name=${EVENT_REF}" >> $GITHUB_OUTPUT
        fi

    - name: Extract release name from branch name
      id: extract_release
      env:
        BRANCH_NAME: ${{ steps.get_pr_branch.outputs.branch_name }}
      shell: bash
      run: |
        branch_name="${BRANCH_NAME}"
        truncated_branch=$(echo "$branch_name" | tr '[:upper:]' '[:lower:]' | tr -s ' _/[]().' '-' | cut -c1-15 | sed 's/-$//')
        echo "release-name=${truncated_branch}" >> $GITHUB_OUTPUT
        echo "release-name being exported: ${truncated_branch}"