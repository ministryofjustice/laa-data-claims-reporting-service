name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: github/codeql-action/init@e2b3eec763ff1ea4c6560fc4b6f2a0818a8f7eb8 # v3.24.5
        with:
          languages: java
      - run: ./gradlew build
      - uses: github/codeql-action/analyze@e2b3eec763ff1ea4c6560fc4b6f2a0818a8f7eb8 # v3.24.5