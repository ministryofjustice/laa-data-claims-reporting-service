name: SpotBugs Security Scan
description: Run SpotBugs/FindSecBugs security analysis and upload SARIF to GitHub Code Scanning

inputs:
  github_token:
    description: 'GitHub token for authentication to private package'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
      with:
        java-version: 25
        distribution: 'corretto'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

    - name: Run SpotBugs security scan and generate SARIF report
      id: spotbugs
      run: |
        echo "Running SpotBugs security analysis..."
        ./gradlew spotbugsMain
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Upload SpotBugs results to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@87557b9c84dde89fdd9b10e88954ac2f4248e463 # v4.36.1
      if: always()
      with:
        sarif_file: build/reports/spotbugs/main.sarif
        category: spotbugs

    - name: Check SpotBugs results
      if: always()
      run: |
        echo "=== SpotBugs SARIF Summary ==="
        if [ -f build/reports/spotbugs/main.sarif ]; then
          echo "✅ SARIF file exists"
          RESULT_COUNT=$(jq '.runs[0].results | length' build/reports/spotbugs/main.sarif 2>/dev/null || echo "0")
          echo "📊 Total issues found: $RESULT_COUNT"
          
          if [ "$RESULT_COUNT" -gt 0 ]; then
            echo ""
            echo "=== Issue Summary ==="
            jq -r '.runs[0].results[] | "\(.level): \(.ruleId) - \(.message.text)"' build/reports/spotbugs/main.sarif | head -20
          else
            echo "🎉 No issues found!"
          fi
        else
          echo "❌ SARIF file not found"
        fi
      shell: bash