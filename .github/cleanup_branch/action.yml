name: "Cleanup branch"
description: 'Cleanup the UAT environment resources after a branch is merged into main'
inputs:
  kube-cert:
    description: "Kubernetes cluster authentication certificate"
    required: true
  kube-token:
    description: "Kubernetes cluster authentication token"
    required: true
  kube-cluster:
    description: "Kubernetes cluster name"
    required: true
  kube-namespace:
    description: "Kubernetes cluster namespace"
    required: true

runs:
  using: "composite"
  steps:

    - name: Get merged release name
      id: extract_release_name_to_delete
      uses: ./.github/get_release_name_to_delete

    - name: Authenticate to the cluster
      uses: ministryofjustice/laa-reusable-github-actions/.github/actions/authenticate_to_cluster@718424912b7cac2b905764128f52ee7c99241507 # latest commit ID for this workflow file
      with:
        kube-cert: ${{ inputs.kube-cert }}
        kube-token: ${{ inputs.kube-token }}
        kube-cluster: ${{ inputs.kube-cluster }}
        kube-namespace: ${{ inputs.kube-namespace }}

    - name: Delete preview release
      env:
        RELEASE_NAME: ${{ steps.extract_release_name_to_delete.outputs.release-name-to-delete }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
      shell: bash
      run: helm uninstall ${RELEASE_NAME} --namespace ${KUBE_NAMESPACE}