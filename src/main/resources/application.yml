spring:
  application:
    name: LAA Claims Data Reporting Application
    version: @version@
  # Default connection details for local dev, overridden in other envs
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/laa_claims_reporting_service_dev
    username: user
    password: dev
  flyway:
    schemas: claims
    create-schemas: true
    enabled: true
    locations: classpath:db/migration/schema,classpath:db/migration/replication
    placeholders:
      reporting_username: "reporting_user"
      reporting_password: "reporting_password"
      replication_source_db_url: "replication_source_db_url"
      replication_source_db_name: "replication_source_db_name"

# ECS structured logging
logging:
  level:
    root: ${ROOT_LOGGING_LEVEL:info}
    org.springframework: ${SPRING_LOGGING_LEVEL:info}
    uk.gov.justice.laa.dstew.claimsreports: ${APP_LOGGING_LEVEL:info}
    org.flywaydb: INFO
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name:default}
        version: ${spring.application.version:default}
        environment: ${spring.profiles.active:default}
        node_name: ${HOSTNAME:unknown}

# used by actuator info endpoint
info:
  app:
    name: LAA Spring Boot Microservice application
    description: An example Spring Boot Microservice application that provides a REST API.
    version: 1.0.0

  # show detailed health status
  endpoint:
    health:
      show-details: always

csv-creation:
  buffer-flush-freq: 5000
  data-chunk-size: 1000

excel-creation:
  row-access-window-size: 100

feature:
  ignore-replication-rowcount-mismatch: ${FEATURE_IGNORE_REPLICATION_ROWCOUNT_MISMATCH:false}
  force-run-rep000: ${FORCE_RUN_REP000:false}
  force-run-rep002: ${FORCE_RUN_REP002:false}
  enable-rep012-xlsx: ${FEATURE_ENABLE_REP012_XLSX:false}