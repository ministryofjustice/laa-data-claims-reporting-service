spring:
  flyway:
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/localtestdata

# Override for local development - use readable console logs with trace IDs
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] [%X{traceId}/%X{spanId}] %-5level %logger{36} - %msg%n"
aws:
  accessKeyId: test
  secretAccessKey: test
  s3:
    endpoint: http://${LOCALSTACK_HOST:localhost}:4566
# Normally these come from Kubernetes hence the formatting difference
S3_REPORT_STORE: "test-bucket"
AWS_REGION: eu-west-1
GATEWAY_ADDRESS: localhost:9091
