plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly('com.github.spotbugs:spotbugs:4.10.4')

    testImplementation('com.github.spotbugs:spotbugs:4.10.4')
    testImplementation('com.github.spotbugs:test-harness:4.10.4')
    testImplementation('com.github.spotbugs:test-harness-jupiter:4.10.4')

    testImplementation('org.junit.jupiter:junit-jupiter-api:5.11.4')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.11.4')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.11.0')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}
