{{- if or (contains "uat" .Release.Namespace) (contains "staging" .Release.Namespace) (contains "prod" .Release.Namespace)}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Namespace }}-database-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"

data:
  {{ .Release.Namespace }}-database.json: |
    {{ include "grafana-database-dashboard-template" . | indent 4 }}

{{- end }}
