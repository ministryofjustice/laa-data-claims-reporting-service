{{- define "grafana-database-dashboard-template" -}}
  {
    "title": "LAA Get Legal Aid Data Database Dashboard - {{ .Release.Name }} / {{ .Release.Namespace }}",
    "schemaVersion": 40,
    "version": 1,
    "refresh": "",
    "tags": ["database", "gpfd", "observability"],
    "time": {
      "from": "now-12h",
      "to": "now"
    },
    "panels": [

      {
        "type": "row",
        "title": "Database Overview",
        "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
      },

      {
        "type": "timeseries",
        "title": "DB Pool Saturation (%)",
        "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
        "datasource": { "type": "prometheus", "uid": "prometheus" },
        "fieldConfig": {
          "defaults": {
            "unit": "percent",
            "thresholds": {
              "mode": "absolute",
              "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 70 },
                { "color": "red", "value": 85 }
              ]
            }
          },
          "overrides": []
        },
        "targets": [
          {
            "expr": "100 * (max_over_time(jdbc_connections_active{namespace='{{ .Release.Namespace }}'}[5m]) / max_over_time(jdbc_connections_max{namespace='{{ .Release.Namespace }}'}[5m]))",
            "legendFormat": "Pool %",
            "refId": "A"
          }
        ]
      },

      {
        "type": "timeseries",
        "title": "Active vs Idle Connections",
        "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
        "datasource": { "type": "prometheus", "uid": "prometheus" },
        "targets": [
          {
            "expr": "avg_over_time(jdbc_connections_active{namespace='{{ .Release.Namespace }}'}[5m])",
            "legendFormat": "Active",
            "refId": "A"
          },
          {
            "expr": "avg_over_time(jdbc_connections_idle{namespace='{{ .Release.Namespace }}'}[5m])",
            "legendFormat": "Idle",
            "refId": "B"
          }
        ]
      },

      {
        "type": "timeseries",
        "title": "DB Max Pool Size",
        "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
        "datasource": { "type": "prometheus", "uid": "prometheus" },
        "targets": [
          {
            "expr": "jdbc_connections_max{namespace='{{ .Release.Namespace }}'}",
            "legendFormat": "Max Pool",
            "refId": "A"
          }
        ]
      },

      {
        "type": "stat",
        "title": "Total Active Connections",
        "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
        "datasource": { "type": "prometheus", "uid": "prometheus" },
        "options": {
          "reduceOptions": {
            "calcs": ["lastNotNull"],
            "values": false
          }
        },
        "targets": [
          {
            "expr": "sum(jdbc_connections_active{namespace='{{ .Release.Namespace }}'})",
            "refId": "A"
          }
        ]
      }

    ]
  }
  {{- end -}}