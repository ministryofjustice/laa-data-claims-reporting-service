{{- if or (contains "uat" .Release.Namespace) (contains "staging" .Release.Namespace) (contains "prod" .Release.Namespace)}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Namespace }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: {{ .Release.Namespace }}-dashboard
data:
    {{ .Release.Namespace }}.json:
    {{ include "grafana-dashboard-template" . | quote | indent 4 }}
{{- end }}