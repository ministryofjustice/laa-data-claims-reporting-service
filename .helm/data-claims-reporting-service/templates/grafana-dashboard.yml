{{- if or (and (contains "uat" .Release.Namespace) (eq .Release.Name "main")) (contains "staging" .Release.Namespace) (contains "prod" .Release.Namespace)}}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Namespace }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: {{ .Release.Namespace }}-dashboard
data:
    {{ .Release.Namespace }}-dashboard.json:
    {{ include "grafana-dashboard-template" . | quote | indent 4 }}
{{- end }}